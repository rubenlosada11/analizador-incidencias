[project]
name = "trackflow-api"
version = "0.1.0"
description = "API centralizada de TrackFlow (FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "analisis-incidencias",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.uv.sources]
analisis-incidencias = { path = "../../packages/analisis-incidencias", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
